race:
  name: "Tor Des Geants 330 - 2026"
  distance_km: 330  # placeholder, update after loading GPX
  elevation_gain_m: 24000  # placeholder
  
  # File paths (relative to project root)
  gpx_file: "config/gpx_repo/TOR330 - 2025_strava.gpx"
  output_file: "results/tor330_segment_analysis.xlsx"
  
  # Analysis settings
  resample_m: 5  # Resample course to 5 m intervals
  elevation_tolerance_m: 50  # Tolerance for elevation validation

  # ITRA score reference points for this race.
  itra_reference_points:
    - reference_time: "86:22:00"
      reference_score: 712
      notes: "Based on 2024 (bad weather year), on good weather 4 hours faster for same points"

  # Optional planning assumptions (can be overridden via CLI)
  planning:
    fatigue_total_decay_pct: 14     # 14% linear decay from start to finish (used when fatigue-mode=race)

    # Sigmoidal fatigue model configuration (used when --fatigue-mode sigmoid).
    # Set fatigue_model_type to "sigmoid" to enable automatically without CLI flag.
    fatigue_model_type: "sigmoid"

    fatigue_parameters:
      # Starting speed as a fraction of Lactate Threshold.
      # TOR athletes start close to the fatigue floor (~55% of LT).
      start_threshold_fraction: 0.55

      # Circadian rhythm amplitude (fraction of floor speed): ±15%.
      circadian_amplitude: 0.15

      # Circadian period in hours (standard 24 h cycle).
      circadian_period_hours: 24

  # Race start time for clock time calculations in reports (optional, defaults to 00:00:00)
  start_time: "10:00:00"


