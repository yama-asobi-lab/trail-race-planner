athlete:
  name: "Carlos"
  weight_kg: 65
  hydration:
    sweat_rate_ml_per_h: 750

  # ITRA performance index
  itra_points: 720

  # Reference flat performance used for Riegel's formula.
  # Should be a road/flat race result (half marathon, marathon, etc.).
  # The pace calculator uses this to derive the baseline flat pace for the course.
  reference_performance:
    distance_km: 42.195
    time: "2:45:00"
    notes: "Road marathon PB"

  # Grade Adjusted Pace (GAP) correction curve.
  # Format: list of [grade_decimal, correction_factor] pairs.
  #   grade_decimal  : slope as rise/run decimal (e.g. 0.10 = 10% uphill, -0.06 = 6% downhill)
  #   correction_factor: pace multiplier relative to flat pace (>1 = slower, <1 = faster)
  # Leave 'points' empty ([]) to use the built-in default trail-running table.
  gap_curve:
    points: 
      - [ 0.20, 2.50  ]  # +20 % cutoff anchor for constant-vspeed tails
      - [ 0.01, 1.075 ]  # +1 %: 7.5 % slower (linear extrapolation above this)
      - [ 0.00, 1.00  ]  # flat
      - [-0.01, 0.965 ]  # −1 %: 3.5 % faster
      - [-0.06, 0.8   ]  # −6 %: 20 % faster (optimal descent)
      - [-0.07, 0.865 ]  # −7 %: braking effect starts
      - [-0.20, 1.71  ]  # −20 % cutoff anchor for constant-vspeed tails

  # Optional physiology parameters for the sigmoidal fatigue model.
  fatigue_physiology:
    # Minimum sustainable speed for expedition-length races (biological floor).
    floor_speed_kmh: 6.0  # ~10:00 min/km

    # Sleep recovery half-life for Process S exponential model (hours).
    sleep_half_life_hours: 3.5

    # Fatigue reaccumulation half-life for Process S exponential model (hours).
    fatigue_reaccumulation_half_life_hours: 3  # This value is normally between 6 and 8 hours, but in the deep fatigue state of late race, I assume fast fatigue reaccumulation.

    # Circadian rhythm amplitude as a fraction of floor speed (±4% default).
    circadian_amplitude_fraction: 0.0001 # set as virtually zero to disable it (due to bugs).

    # Power-law calibration parameters for the sigmoid model.
    # Reference relative intensity S_0 and inflection time t_0 (hours) at S_0.
    # For Carlos: at S_0=0.65 the velocity drop inflection occurs at ~18 h.
    s_0: 0.83
    t_0_hours: 10.0
    # Sigmoid steepness (h⁻¹) at reference intensity S_0.
    k_0: 0.45

  # Altitude-effects slowdown model.
  # Baseline cohort value is 0.063 (6.3% per vertical-km), with inter-athlete
  # variability around sigma ~0.025.
  altitude_effects:
    slowdown_per_vertical_km: 0.06

  preferences:
    threshold_flat_pace_per_km: "3:55/km"  # LT2
    aerobic_threshold_flat_pace_per_km: "4:40/km"  # LT1
